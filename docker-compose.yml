# autoloan-nextjs-metafullstack/docker-compose.yml
services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=autoloan
      - POSTGRES_PASSWORD=localdevpassword123
      - POSTGRES_DB=autoloan_nextjs
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoloan -d autoloan_nextjs"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://autoloan:localdevpassword123@db:5432/autoloan_nextjs
      - JWT_SECRET=local-dev-jwt-secret-key-minimum-32-characters-long
      - NEXT_PUBLIC_API_URL=/api/v1
      - NODE_ENV=production
    ports:
      - "3003:3001"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
